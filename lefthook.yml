# Git hooks, installed by `npm ci` (the "prepare" script). Docs: https://lefthook.dev/configuration/
# They run on staged files only and take a few seconds. CI re-runs lint and type checks on every PR,
# so a commit made with --no-verify is still caught there.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,cjs,json,css,html,yml,yaml}"
      # The browser checks stay in their compact style; reformatting them would bury real changes.
      exclude:
        - "e2e/**"
        - "docs/audits/**"
        - "docs/agreement/robustness-output/**"
        - "package-lock.json"
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: npx eslint --no-warn-ignored {staged_files}

    - name: secrets
      # The script explains itself; gitleaks is optional on a laptop.
      run: sh scripts/hooks/secret-scan.sh
